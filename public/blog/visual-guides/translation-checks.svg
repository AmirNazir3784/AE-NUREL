<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" role="img" aria-label="Correct meaning, usable timing and the right exported file are separate requirements. Preserving timestamps alone does not establish a good translation."><rect width="760" height="200" rx="16" fill="#10221d"/><text x="28" y="40" fill="#80d2c0" font-size="14" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">A TRANSLATION IS MORE THAN UNCHANGED TIMESTAMPS</text><rect x="28" y="72" width="212" height="88" rx="12" fill="#1b2d29" stroke="#45645b"/><text x="46" y="104" fill="#f1f7f4" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Meaning</text><text x="46" y="134" fill="#b1c0bb" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Names · numbers · tone</text><rect x="274" y="72" width="212" height="88" rx="12" fill="#1b2d29" stroke="#45645b"/><text x="292" y="104" fill="#f1f7f4" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Reading time</text><text x="292" y="134" fill="#b1c0bb" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Length · cue boundaries</text><rect x="520" y="72" width="212" height="88" rx="12" fill="#1b2d29" stroke="#45645b"/><text x="538" y="104" fill="#f1f7f4" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Delivery</text><text x="538" y="134" fill="#b1c0bb" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Language · format · revision</text></svg>

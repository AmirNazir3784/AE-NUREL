<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" role="img" aria-label="The same 65–68-second cue retains its duration. Interval reset subtracts 60 seconds; count reset starts this part at its first cue."><rect width="760" height="270" rx="16" fill="#10221d"/><text x="28" y="40" fill="#80d2c0" font-size="14" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">SAME CUE · THREE ALTERNATIVES</text><rect x="28" y="72" width="212" height="88" rx="12" fill="#1b2d29" stroke="#45645b"/><text x="46" y="104" fill="#f1f7f4" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Original time</text><text x="46" y="134" fill="#b1c0bb" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">65 → 68 seconds</text><rect x="274" y="72" width="212" height="88" rx="12" fill="#1b2d29" stroke="#45645b"/><text x="292" y="104" fill="#f1f7f4" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">1-minute reset</text><text x="292" y="134" fill="#b1c0bb" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">5 → 8 seconds</text><rect x="520" y="72" width="212" height="88" rx="12" fill="#1b2d29" stroke="#45645b"/><text x="538" y="104" fill="#f1f7f4" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Count reset</text><text x="538" y="134" fill="#b1c0bb" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">0 → 3 seconds</text><text x="28" y="205" fill="#80d2c0" font-size="17" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Subtract the interval boundary</text><text x="28" y="235" fill="#b1c0bb" font-size="17" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">or the part’s first cue — these are different origins.</text></svg>

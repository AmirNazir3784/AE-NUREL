<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-label="The number identifies the cue; comma milliseconds define its display interval; a blank line separates it from the next cue."><rect width="760" height="320" rx="16" fill="#10221d"/><text x="28" y="40" fill="#80d2c0" font-size="14" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">ANATOMY OF ONE SRT CUE</text><rect x="28" y="66" width="704" height="220" rx="12" fill="#1b2d29" stroke="#45645b"/><text x="52" y="105" fill="#ffb46d" font-size="18" font-weight="400" text-anchor="start" font-family="monospace">1</text><text x="52" y="150" fill="#f1f7f4" font-size="22" font-weight="400" text-anchor="start" font-family="monospace">00:00:02,000 --&gt; 00:00:04,500</text><text x="52" y="197" fill="#f1f7f4" font-size="22" font-weight="400" text-anchor="start" font-family="monospace">This is a subtitle.</text><path d="M52 246L710 246" fill="none" stroke="#45645b" stroke-width="2" stroke-dasharray="5 6"/><text x="80" y="105" fill="#b1c0bb" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Cue number</text><text x="52" y="270" fill="#b1c0bb" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Blank line before the next cue</text></svg>

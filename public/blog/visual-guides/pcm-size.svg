<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-label="48,000 samples per second at 16 bits in one channel require 96,000 bytes per second: 57.6 decimal MB for ten minutes, excluding headers."><rect width="760" height="290" rx="16" fill="#10221d"/><text x="28" y="40" fill="#80d2c0" font-size="14" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">ONE PCM CONFIGURATION · NOT EVERY WAV</text><rect x="28" y="72" width="212" height="88" rx="12" fill="#1b2d29" stroke="#45645b"/><text x="46" y="104" fill="#f1f7f4" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">48,000 Hz</text><text x="46" y="134" fill="#b1c0bb" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Samples / second</text><rect x="274" y="72" width="212" height="88" rx="12" fill="#1b2d29" stroke="#45645b"/><text x="292" y="104" fill="#f1f7f4" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">16 bits</text><text x="292" y="134" fill="#b1c0bb" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Per sample</text><rect x="520" y="72" width="212" height="88" rx="12" fill="#1b2d29" stroke="#45645b"/><text x="538" y="104" fill="#f1f7f4" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">1 channel</text><text x="538" y="134" fill="#b1c0bb" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Mono audio</text><text x="28" y="212" fill="#80d2c0" font-size="23" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">48,000 × 16 × 1 ÷ 8 = 96,000 bytes/s</text><text x="28" y="254" fill="#b1c0bb" font-size="20" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">10 minutes ≈ 57.6 MB, excluding headers</text></svg>

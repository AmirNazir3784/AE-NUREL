<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-label="116 seconds of subtitle timeline, four seconds of remaining chapter video and a two-second leading pause place the next cue at 122 seconds."><rect width="760" height="290" rx="16" fill="#10221d"/><text x="28" y="40" fill="#80d2c0" font-size="14" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">WHY THE VIDEO BOUNDARY MATTERS</text><rect x="28" y="72" width="212" height="88" rx="12" fill="#1b2d29" stroke="#45645b"/><text x="46" y="104" fill="#f1f7f4" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Subtitle end</text><text x="46" y="134" fill="#b1c0bb" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">116 seconds</text><rect x="274" y="72" width="212" height="88" rx="12" fill="#1b2d29" stroke="#45645b"/><text x="292" y="104" fill="#f1f7f4" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Remaining video</text><text x="292" y="134" fill="#b1c0bb" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">+ 4 seconds</text><rect x="520" y="72" width="212" height="88" rx="12" fill="#1b2d29" stroke="#45645b"/><text x="538" y="104" fill="#f1f7f4" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Next leading pause</text><text x="538" y="134" fill="#b1c0bb" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">+ 2 seconds</text><text x="28" y="205" fill="#ffb46d" font-size="18" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Video join: 120 seconds</text><text x="28" y="252" fill="#80d2c0" font-size="27" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">116 + 4 + 2 = 122 seconds</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-label="A cue at episode time 12:32.500 becomes 2.500 seconds into a clip whose in-point is 12:30.000. Later edits need another timing review."><rect width="760" height="260" rx="16" fill="#10221d"/><text x="28" y="40" fill="#80d2c0" font-size="14" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">EPISODE TIME − CLIP IN-POINT = CLIP TIME</text><rect x="28" y="72" width="212" height="88" rx="12" fill="#1b2d29" stroke="#45645b"/><text x="46" y="104" fill="#f1f7f4" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Episode cue</text><text x="46" y="134" fill="#b1c0bb" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">12:32.500</text><rect x="274" y="72" width="212" height="88" rx="12" fill="#1b2d29" stroke="#45645b"/><text x="292" y="104" fill="#f1f7f4" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Clip in-point</text><text x="292" y="134" fill="#b1c0bb" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">− 12:30.000</text><rect x="520" y="72" width="212" height="88" rx="12" fill="#1b2d29" stroke="#45645b"/><text x="538" y="104" fill="#f1f7f4" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Clip cue</text><text x="538" y="134" fill="#b1c0bb" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">00:02.500</text><path d="M242 116L266 116" fill="none" stroke="#80d2c0" stroke-width="2" /><path d="M260 111L266 116L260 121" fill="none" stroke="#80d2c0" stroke-width="2"/><path d="M488 116L512 116" fill="none" stroke="#80d2c0" stroke-width="2" /><path d="M506 111L512 116L506 121" fill="none" stroke="#80d2c0" stroke-width="2"/><text x="28" y="218" fill="#b1c0bb" font-size="20" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">For a c
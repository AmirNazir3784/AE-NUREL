<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-label="72 characters displayed for three seconds require 24 characters per second; four seconds reduces that to 18. Extra time must fit the actual scene."><rect width="760" height="280" rx="16" fill="#10221d"/><text x="28" y="40" fill="#80d2c0" font-size="14" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">72 CHARACTERS · TWO DISPLAY DURATIONS</text><rect x="28" y="76" width="330" height="88" rx="12" fill="#1b2d29" stroke="#45645b"/><text x="46" y="108" fill="#f1f7f4" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">3 seconds</text><text x="46" y="138" fill="#b1c0bb" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">72 ÷ 3 = 24 CPS</text><rect x="402" y="76" width="330" height="88" rx="12" fill="#1b2d29" stroke="#45645b"/><text x="420" y="108" fill="#f1f7f4" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">4 seconds</text><text x="420" y="138" fill="#b1c0bb" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">72 ÷ 4 = 18 CPS</text><rect x="28" y="188" width="330" height="10" rx="5" fill="#ffb46d" stroke="#ffb46d"/><rect x="402" y="188" width="248" height="10" rx="5" fill="#80d2c0" stroke="#80d2c0"/><text x="28" y="240" fill="#b1c0bb" font-size="18" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Check speech, cuts and neighboring cues before extending.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-label="A transcript reference identifies a point. A subtitle cue has both a start and an end, so the player knows when to remove it."><rect width="760" height="310" rx="16" fill="#10221d"/><text x="28" y="40" fill="#80d2c0" font-size="14" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">A POINT AND AN INTERVAL DO DIFFERENT JOBS</text><rect x="28" y="72" width="704" height="88" rx="12" fill="#1b2d29" stroke="#45645b"/><text x="46" y="104" fill="#f1f7f4" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Transcript: [05:12]</text><text x="46" y="134" fill="#b1c0bb" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Jump to the explanation</text><rect x="28" y="188" width="704" height="88" rx="12" fill="#1b2d29" stroke="#45645b"/><text x="46" y="220" fill="#f1f7f4" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Subtitle: 05:12.000 → 05:15.200</text><text x="46" y="250" fill="#b1c0bb" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Show the words, then remove them</text></svg>

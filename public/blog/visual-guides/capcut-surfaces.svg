<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-label="Desktop uses Captions, Add Captions. Web uses Captions, Upload caption file. The current official help does not support direct mobile subtitle-file import."><rect width="760" height="290" rx="16" fill="#10221d"/><text x="28" y="40" fill="#80d2c0" font-size="14" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">CHECK THE PLATFORM BEFORE CHANGING THE FILE</text><rect x="28" y="72" width="330" height="88" rx="12" fill="#1b2d29" stroke="#45645b"/><text x="46" y="104" fill="#f1f7f4" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Desktop</text><text x="46" y="134" fill="#b1c0bb" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Captions → Add Captions</text><rect x="402" y="72" width="330" height="88" rx="12" fill="#1b2d29" stroke="#45645b"/><text x="420" y="104" fill="#f1f7f4" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Web</text><text x="420" y="134" fill="#b1c0bb" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Captions → Upload caption file</text><rect x="28" y="190" width="704" height="70" rx="12" fill="#503c29" stroke="#ffb46d"/><text x="48" y="232" fill="#ffb46d" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Mobile: no direct SRT import in current Help</text></svg>
